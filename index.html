<html lang="fr">
<head>

    <title>Générateur de Reçu CHU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<body class="bg-gray-100 font-sans text-gray-800 antialiased">

    <div class="max-w-md mx-auto my-6 bg-white rounded-xl shadow-md overflow-hidden md:max-w-lg border border-gray-200">
        <div class="bg-blue-600 p-4 text-white text-center">
            <h2 class="text-xl font-bold" style="font-family:'Inter',sans-serif;">Générateur Reçu CHU</h2>
            <p class="text-xs opacity-80 mt-1">Outil statique autorisé pour tests et comparaison</p>
        </div>
        
        <div class="p-5 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 1 : Patient & Informations</label>
                <div class="text-xs text-gray-500 mb-1">Ordre : Nom Prénom, N° Reçu, CAT, Âge(ans), ISN</div>
                <div class="text-xs text-blue-600 font-mono mb-2 italic">Ex: KONE SALI 08354290926 CAT2 33ans 456283902</div>
                <textarea id="zone1" rows="2" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Collez les données ici..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 2 : Dates d'hospitalisation</label>
                <div class="text-xs text-blue-600 font-mono mb-2 italic">Ex: 20/09/2026 au 23/09/2026</div>
                <input type="text" id="zone2" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="jj/mm/aaaa au jj/mm/aaaa">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 3 : Enregistré par</label>
                <input type="text" id="zone3" list="enregistre-list" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Sélectionnez ou saisissez...">
                <datalist id="enregistre-list">
                    <option value="ALLEGBE ARDON RUBEN BORIS JOSE"></option>
                    <option value="BOH KANGRO"></option>
                    <option value="AGRE OHIE JEAN FERLUS"></option>
                    <option value="KOUAME AFFOUE SABINE"></option>
                    <option value="KPAZAI ROCK FELLER"></option>
                </datalist>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 4 : Encaissé par</label>
                <input type="text" id="zone4" list="encaisse-list" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Sélectionnez ou saisissez...">
                <datalist id="encaisse-list">
                    <option value="AKA OI AKA LAURENT"></option>
                    <option value="KOFFI FRANCOISE AMLAN"></option>
                </datalist>
            </div>
            <div id="error-msg" class="text-red-600 bg-red-50 p-2 rounded text-sm hidden font-medium text-center"></div>
            <button id="generate-btn" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-4 rounded-lg shadow transition transform active:scale-95 flex justify-center items-center gap-2" style="font-family:'Inter',sans-serif;">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
                Générer le Reçu PDF
            </button>
            <div class="text-xs text-gray-400 text-center">Les données sont effacées automatiquement après génération.</div>
        </div>
    </div>

ASUVORK5CYII=";

    // ===== HELPERS =====
    const priceMap = { 'CAT1': 30000, 'CAT2': 20000, 'CAT3': 10000 };
    function fmtNum(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function pad(n) { return n.toString().padStart(2, '0'); }
    function fmtDate(d) { return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear(); }
    function fmtTime(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); }
    function fmtDateTime(d) { return pad(d.getDate()) + "/" + pad(d.getMonth()+1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
    function parseFR(s) { var p=s.trim().split('/'); return p.length===3 ? new Date(p[2],p[1]-1,p[0]) : null; }

    function showErr(msg) {
        var e = document.getElementById('error-msg');
        e.textContent = msg;
        e.classList.remove('hidden');
    }

    function getQRDataUrl(text) {
        var div = document.getElementById('qr-temp');
        div.innerHTML = '';
        new QRCode(div, { text: text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
        var canvas = div.querySelector('canvas');
        return canvas.toDataURL('image/png');
    }

    // ===== MAIN GENERATOR =====
    document.getElementById('generate-btn').addEventListener('click', function() {
        var z1 = document.getElementById('zone1').value.trim();
        var z2 = document.getElementById('zone2').value.trim();
        var z3 = document.getElementById('zone3').value.trim();
        var z4 = document.getElementById('zone4').value.trim();
        var errEl = document.getElementById('error-msg');
        var btn = document.getElementById('generate-btn');
        errEl.classList.add('hidden');

        if (!z1 || !z2 || !z3 || !z4) { showErr("Veuillez remplir toutes les zones."); return; }

        var m1 = z1.match(/(.+?)\s+(\d{6,})\s+(CAT[1-3])\s+(\d+)\s*ans\s+(\d+)/i);
        if (!m1) { showErr("Erreur Zone 1. Format: NOM PRENOM NumReçu CAT Âgeans ISN"); return; }

        var patientName = m1[1].trim().toUpperCase();
        var receiptNum = m1[2];
        var cat = m1[3].toUpperCase();
        var age = m1[4];
        var isn = m1[5];

        var m2 = z2.match(/(\d{2}\/\d{2}\/\d{4})\s*au\s*(\d{2}\/\d{2}\/\d{4})/i);
        if (!m2) { showErr("Erreur Zone 2. Format: jj/mm/aaaa au jj/mm/aaaa"); return; }

        var startStr = m2[1], endStr = m2[2];
        var startD = parseFR(startStr), endD = parseFR(endStr);
        if (!startD || !endD || startD > endD) { showErr("Dates invalides."); return; }

        var qt = Math.ceil(Math.abs(endD - startD) / 86400000);
        var pu = priceMap[cat] || 10000;
        var total = pu * qt;

        var now = new Date();
        var payD = new Date(now.getTime() - 40000);

        btn.innerHTML = "⏳ Création du PDF...";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        // Generate QR code
        var qrDataUrl = getQRDataUrl(receiptNum);

        // Build PDF with jsPDF
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        // A4 = 595.28 x 841.89 pt

        var pageW = 595.28;
        var pageH = 841.89;

        // ---- Draw one receipt half ----
        function drawHalf(yOffset) {
            var x0 = 24; // left margin
            var xMid = 316; // where RECU/payment info starts
            var xRight = pageW - 24; // right margin

            // Top line: date left, "Undefined" right
            doc.setFontSize(8);
            doc.setTextColor(0, 0, 0);
            doc.text(fmtDateTime(now), x0, yOffset + 20);
            doc.text("Undefined", xRight, yOffset + 20, { align: 'right' });

            // Logo image (left side)
            var logoW = 180; // width in pt
            var logoH = 172; // height in pt
            doc.addImage("data:image/png;base64," + LOGO_B64, 'PNG', x0 - 2, yOffset + 24, logoW, logoH);

            // REÇU title
            doc.setFontSize(18);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(0, 0, 0);
            doc.text("REÇU", xMid, yOffset + 42);

            // N° receipt
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(76, 89, 107);
            doc.text("N° " + receiptNum, xMid, yOffset + 55);

            // PAYÉ
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(56, 142, 60);
            doc.text("PAYÉ", xMid, yOffset + 82);

            // QR Code (top right)
            doc.addImage(qrDataUrl, 'PNG', xRight - 65, yOffset + 24, 60, 60);

            // Payment details
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(76, 89, 107);
            var pyY = yOffset + 108;
            var lineH = 15;
            doc.text("Mode de paiement : Espèces", xMid, pyY);
            doc.text("Date de paiement : " + fmtDate(payD) + " , " + fmtTime(payD), xMid, pyY + lineH);
            doc.text("Date d'émission " + fmtDate(now) + " , " + fmtTime(now), xMid, pyY + lineH*2);
            doc.text("Montant total : " + fmtNum(total) + " FCFA", xMid, pyY + lineH*3);
            doc.text("Montant reçu : " + fmtNum(total) + " FCFA", xMid, pyY + lineH*4);
            doc.text("Monnaie : 0 FCFA", xMid, pyY + lineH*5);

            // Info boxes
            var boxY = yOffset + 200;
            var boxH = 52;
            var boxW1 = 255;
            var boxW2 = 255;
            var boxGap = 15;
            var boxX1 = x0;
            var boxX2 = x0 + boxW1 + boxGap;

            // Box 1 - Patient info
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.5);
            doc.roundedRect(boxX1, boxY, boxW1, boxH, 4, 4);

            doc.setFontSize(9);
            doc.setTextColor(0, 0, 0);
            doc.setFont('helvetica', 'bold');
            doc.text("Nom & Prenom : ", boxX1 + 8, boxY + 14);
            doc.setFont('helvetica', 'normal');
            doc.text(patientName, boxX1 + 8 + doc.getTextWidth("Nom & Prenom : "), boxY + 14);

            doc.setFont('helvetica', 'bold');
            doc.text("ISN & Sexe: ", boxX1 + 8, boxY + 28);
            doc.setFont('helvetica', 'normal');
            doc.text(isn + " / F", boxX1 + 8 + doc.getTextWidth("ISN & Sexe: "), boxY + 28);

            doc.setFont('helvetica', 'bold');
            doc.text("Age [Année / mois / jours ] : ", boxX1 + 8, boxY + 42);
            doc.setFont('helvetica', 'normal');
            doc.text(age + " ans/ 0 mois / 0 jour (s)", boxX1 + 8 + doc.getTextWidth("Age [Année / mois / jours ] : "), boxY + 42);

            // Box 2 - Service info
            doc.roundedRect(boxX2, boxY, boxW2, boxH, 4, 4);

            doc.setFont('helvetica', 'bold');
            doc.text("Service : ", boxX2 + 8, boxY + 14);
            doc.setFont('helvetica', 'normal');
            doc.text("GYNECOLOGIE", boxX2 + 8 + doc.getTextWidth("Service : "), boxY + 14);

            doc.setFont('helvetica', 'bold');
            doc.text("Enregistré par : ", boxX2 + 8, boxY + 28);
            doc.setFont('helvetica', 'normal');
            doc.text(z3.toUpperCase(), boxX2 + 8 + doc.getTextWidth("Enregistré par : "), boxY + 28);

            doc.setFont('helvetica', 'bold');
            doc.text("Encaissé par : ", boxX2 + 8, boxY + 42);
            doc.setFont('helvetica', 'normal');
            doc.text(z4.toUpperCase(), boxX2 + 8 + doc.getTextWidth("Encaissé par : "), boxY + 42);

            // Table
            var tY = boxY + boxH + 15;
            var cols = [
                { label: "N° D'ORDRE", w: 60 },
                { label: "PRESTATION", w: 210 },
                { label: "PU INITIAL", w: 70 },
                { label: "QT", w: 30 },
                { label: "RÉDUCTION", w: 65 },
                { label: "TOTAL À PAYER", w: 90 }
            ];
            var tX = x0;
            var rowH = 16;

            // Header
            doc.setFillColor(250, 250, 250);
            doc.setDrawColor(220, 220, 220);
            doc.setLineWidth(0.5);
            doc.setFontSize(8);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(0, 0, 0);
            var cx = tX;
            for (var i = 0; i < cols.length; i++) {
                doc.rect(cx, tY, cols[i].w, rowH, 'FD');
                doc.text(cols[i].label, cx + 4, tY + 11);
                cx += cols[i].w;
            }

            // Data row
            var dY = tY + rowH;
            var dataRowH = 28;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            cx = tX;
            var prestText = "HOSPITALISATION GYNECOLOGIE " + cat.replace('CAT', 'CAT ') + "/ GOP. du " + startStr + " au";
            var prestText2 = endStr;
            var dataVals = [
                "",
                prestText,
                fmtNum(pu) + " FCFA",
                "" + qt,
                "Aucune",
                fmtNum(total) + " FCFA"
            ];
            for (var i = 0; i < cols.length; i++) {
                doc.setFillColor(255, 255, 255);
                doc.rect(cx, dY, cols[i].w, dataRowH, 'FD');
                if (i === 1) {
                    doc.text(prestText, cx + 4, dY + 11);
                    doc.text(prestText2, cx + 4, dY + 22);
                } else {
                    doc.text(dataVals[i], cx + 4, dY + 17);
                }
                cx += cols[i].w;
            }
        }

        // Draw first half
        drawHalf(0);

        // Divider
        var dividerY = 322;
        doc.addImage("data:image/png;base64," + DIVIDER_B64, 'PNG', 0, dividerY, pageW, 32);

        // Draw second half
        drawHalf(dividerY + 15);

        // Footer
        doc.setFontSize(8);
        doc.setTextColor(120, 120, 120);
        doc.setFont('helvetica', 'normal');
        doc.text("https://v2.sgch.app/workspace/GCF/ticket", 24, pageH - 20);
        doc.text("1/1", pageW - 24, pageH - 20, { align: 'right' });

        // Output
        var filename = "Recu_" + receiptNum + ".pdf";
        var pdfBlob = doc.output('blob');

        // Reset button
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg> Générer le Reçu PDF';
        btn.style.opacity = "1";
        btn.disabled = false;

        // Share or download
        if (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], filename, { type: 'application/pdf' })] })) {
            navigator.share({
                files: [new File([pdfBlob], filename, { type: 'application/pdf' })],
                title: 'Reçu CHU'
            }).catch(function() {
                downloadPDF(pdfBlob, filename);
            });
        } else {
            downloadPDF(pdfBlob, filename);
        }

        // Clear fields
        ['zone1','zone2','zone3','zone4'].forEach(function(id) { document.getElementById(id).value = ''; });
    });

    function downloadPDF(blob, filename) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function() {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 200);
    }
    </script>
</body>
