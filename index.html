<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Générateur de Reçu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased selection:bg-blue-200">

    <div class="max-w-md mx-auto my-6 bg-white rounded-xl shadow-md overflow-hidden md:max-w-lg border border-gray-200">
        <div class="bg-blue-600 p-4 text-white text-center">
            <h2 class="text-xl font-bold">Générateur Reçu CHU</h2>
            <p class="text-xs opacity-80 mt-1">Outil statique autorisé pour tests</p>
        </div>
        
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 1 : Patient</label>
                <div class="text-xs text-gray-500 mb-2">Ex: KONE SALI 08354290926 CAT2 33ans 456283902</div>
                <textarea id="zone1" rows="3" class="w-full border rounded-lg p-3 text-sm focus:ring-2 outline-none transition"></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 2 : Dates d'hospitalisation</label>
                <div class="text-xs text-gray-500 mb-2">Ex: 20/09/2026 au 23/09/2026</div>
                <input type="text" id="zone2" class="w-full border rounded-lg p-3 text-sm focus:ring-2 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 3 : Enregistré par</label>
                <input type="text" id="zone3" list="enregistre-list" class="w-full border rounded-lg p-3 text-sm focus:ring-2 outline-none transition">
                <datalist id="enregistre-list">
                    <option value="ALLEGBE ARDON RUBEN BORIS JOSE"></option>
                    <option value="BOH KANGRO"></option>
                    <option value="AGRE OHIE JEAN FERLUS"></option>
                    <option value="KOUAME AFFOUE SABINE"></option>
                    <option value="KPAZAI ROCK FELLER"></option>
                </datalist>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Zone 4 : Encaissé par</label>
                <input type="text" id="zone4" list="encaisse-list" class="w-full border rounded-lg p-3 text-sm focus:ring-2 outline-none transition">
                <datalist id="encaisse-list">
                    <option value="AKA OI AKA LAURENT"></option>
                    <option value="KOFFI FRANCOISE AMLAN"></option>
                </datalist>
            </div>
            <div id="error-msg" class="text-red-600 bg-red-50 p-2 rounded text-sm hidden font-medium text-center"></div>
            <button id="generate-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg flex justify-center items-center gap-2">Générer le Reçu PDF</button>
        </div>
    </div>

    <script>
        const priceMap = { 'CAT1': 30000, 'CAT2': 20000, 'CAT3': 10000 };
        function formatNumber(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
        function pad(n) { return n.toString().padStart(2, '0'); }
        function formatDate(date) { return pad(date.getDate()) + "/" + pad(date.getMonth() + 1) + "/" + date.getFullYear(); }
        function formatTime(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()); }
        function parseFRDate(dateStr) {
            const parts = dateStr.trim().split('/');
            return parts.length === 3 ? new Date(parts[2], parts[1] - 1, parts[0]) : null;
        }

        document.getElementById('generate-btn').addEventListener('click', function() {
            const z1 = document.getElementById('zone1').value.trim();
            const z2 = document.getElementById('zone2').value.trim();
            const z3 = document.getElementById('zone3').value.trim();
            const z4 = document.getElementById('zone4').value.trim();
            const errorEl = document.getElementById('error-msg');
            const btn = document.getElementById('generate-btn');
            
            errorEl.classList.add('hidden');

            if(!z1 || !z2 || !z3 || !z4) {
                errorEl.textContent = "Veuillez remplir toutes les zones.";
                errorEl.classList.remove('hidden');
                return;
            }

            const match1 = z1.match(/(.+?)\s+(\d{6,})\s+(CAT[1-3])\s+(\d+)\s*ans\s+(\d+)/i);
            if(!match1) {
                errorEl.textContent = "Erreur Zone 1 : Format incorrect. Copiez exactement comme l'exemple.";
                errorEl.classList.remove('hidden');
                return;
            }

            const patientName = match1[1].trim().toUpperCase();
            const receiptNum = match1[2];
            const cat = match1[3].toUpperCase();
            const age = match1[4];
            const isn = match1[5];

            const match2 = z2.match(/(\d{2}\/\d{2}\/\d{4})\s*au\s*(\d{2}\/\d{2}\/\d{4})/i);
            if(!match2) {
                errorEl.textContent = "Erreur Zone 2 : Respectez le format (jj/mm/aaaa au jj/mm/aaaa)";
                errorEl.classList.remove('hidden');
                return;
            }

            const startDateStr = match2[1];
            const endDateStr = match2[2];
            const startDate = parseFRDate(startDateStr);
            const endDate = parseFRDate(endDateStr);

            if(!startDate || !endDate || startDate > endDate) {
                errorEl.textContent = "Les dates sont invalides.";
                errorEl.classList.remove('hidden');
                return;
            }

            btn.innerHTML = "⏳ Création du document...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            const qt = Math.ceil(Math.abs(endDate - startDate) / (1000 * 60 * 60 * 24));
            const pu = priceMap[cat] || 10000;
            const totalAmount = pu * qt;
            
            const now = new Date();
            const paymentDate = new Date(now.getTime() - 40000);
            
            const dateEmiStr = formatDate(now) + " , " + formatTime(now);
            const datePaiStr = formatDate(paymentDate) + " , " + formatTime(paymentDate);
            const topDateStr = pad(now.getDate()) + "/" + pad(now.getMonth() + 1) + "/" + now.getFullYear() + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());

            const qrDiv = document.createElement('div');
            new QRCode(qrDiv, { text: receiptNum, width: 80, height: 80, correctLevel: QRCode.CorrectLevel.M });
            const qrCanvas = qrDiv.querySelector('canvas');
            const qrDataUrl = qrCanvas.toDataURL('image/png');

            const buildHalf = () => `
                <div style="width: 794px; padding: 25px 40px; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #222; background-color: #fff;">
                    
                    <!-- Top Line -->
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 15px;">
                        <span>${topDateStr}</span>
                        <span>Undefined</span>
                    </div>

                    <div style="display: flex; justify-content: space-between;">
                        
                        <!-- Left: CHU Info -->
                        <div style="width: 210px;">
                            <div style="text-align: center;">
                                <div style="font-size: 12px; color: #444; letter-spacing: 1px;">**************************</div>
                                <div style="font-size: 14px; font-weight: bold; margin: 4px 0;">CHU COCODY</div>
                                <div style="font-size: 12px; color: #444; letter-spacing: 1px;">**************************</div>
                                <div style="color: #0d47a1; font-weight: 900; font-size: 64px; font-family: 'Arial Black', Impact, sans-serif; line-height: 0.8; margin-top: 10px; letter-spacing: -1px;">CHU</div>
                                <div style="color: #0d47a1; font-size: 8px; font-weight: bold; letter-spacing: 0px; margin-top: 3px;">CENTRE HOSPITALIER UNIVERSITAIRE</div>
                                <div style="display: flex; justify-content: center; margin-top: 2px;">
                                    <div style="background-color: #d32f2f; color: white; font-size: 11px; font-weight: bold; padding: 1px 8px;">COCODY</div>
                                </div>
                            </div>
                            <div style="border-top: 2px solid #000; border-bottom: 2px solid #000; font-size: 16px; font-weight: 900; text-align: center; margin-top: 15px; padding: 3px 0;">
                                00225 27 22 48 10 00
                            </div>
                        </div>

                        <!-- Middle: RECU Info -->
                        <div style="flex-grow: 1; padding-left: 40px;">
                            <div style="font-size: 22px; font-weight: bold; margin: 0; color: #000;">REÇU</div>
                            <div style="color: #777; font-size: 14px; margin-top: 2px;">N° ${receiptNum}</div>
                            <div style="color: #388e3c; font-size: 17px; font-weight: bold; margin-top: 15px;">PAYÉ</div>
                            
                            <div style="margin-top: 25px; line-height: 1.6; color: #333; font-size: 13px;">
                                <div>Mode de paiement : Espèces</div>
                                <div>Date de paiement : ${datePaiStr}</div>
                                <div>Date d'émission ${dateEmiStr}</div>
                                <div>Montant total : ${formatNumber(totalAmount)} FCFA</div>
                                <div>Montant reçu : ${formatNumber(totalAmount)} FCFA</div>
                                <div>Monnaie : 0 FCFA</div>
                            </div>
                        </div>

                        <!-- Right: QR Code -->
                        <div style="width: 100px; display: flex; justify-content: flex-end; align-items: flex-start;">
                            <img src="${qrDataUrl}" style="width: 85px; height: 85px;" />
                        </div>
                    </div>

                    <!-- Info Boxes -->
                    <div style="display: flex; gap: 15px; margin-top: 25px;">
                        <div style="flex: 1; border: 1px solid #ccc; border-radius: 6px; padding: 12px; line-height: 1.6;">
                            <div><span style="font-weight: bold;">Nom & Prenom :</span> ${patientName}</div>
                            <div><span style="font-weight: bold;">ISN & Sexe :</span> ${isn} / F</div>
                            <div><span style="font-weight: bold;">Age [Année / mois / jours ] :</span> ${age} ans/ 0 mois / 0 jour (s)</div>
                        </div>
                        <div style="flex: 1; border: 1px solid #ccc; border-radius: 6px; padding: 12px; line-height: 1.6;">
                            <div><span style="font-weight: bold;">Service :</span> GYNECOLOGIE</div>
                            <div><span style="font-weight: bold;">Enregistré par :</span> ${z3.toUpperCase()}</div>
                            <div><span style="font-weight: bold;">Encaissé par :</span> ${z4.toUpperCase()}</div>
                        </div>
                    </div>

                    <!-- Table -->
                    <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px;">
                        <thead>
                            <tr>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: left; background-color: #fcfcfc;">N° D'ORDRE</th>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: left; background-color: #fcfcfc;">PRESTATION</th>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: left; background-color: #fcfcfc;">PU INITIAL</th>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: center; background-color: #fcfcfc;">QT</th>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: left; background-color: #fcfcfc;">RÉDUCTION</th>
                                <th style="border: 1px solid #ddd; padding: 10px; text-align: left; background-color: #fcfcfc;">TOTAL À PAYER</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="border: 1px solid #ddd; padding: 10px;"></td>
                                <td style="border: 1px solid #ddd; padding: 10px;">HOSPITALISATION GYNECOLOGIE ${cat.replace('CAT', 'CAT ')}/ GOP. du ${startDateStr} au ${endDateStr}</td>
                                <td style="border: 1px solid #ddd; padding: 10px;">${formatNumber(pu)} FCFA</td>
                                <td style="border: 1px solid #ddd; padding: 10px; text-align: center;">${qt}</td>
                                <td style="border: 1px solid #ddd; padding: 10px;">Aucune</td>
                                <td style="border: 1px solid #ddd; padding: 10px;">${formatNumber(totalAmount)} FCFA</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            const fullHtml = `
                <div style="background-color: white;">
                    ` + buildHalf() + `
                    <div style="display: flex; align-items: center; justify-content: center; width: 794px; padding: 0 40px; box-sizing: border-box; color: #888;">
                        <div style="flex: 1; border-top: 2px dashed #bbb;"></div>
                        <div style="margin: 0 15px; font-size: 18px;">✂</div>
                        <div style="flex: 1; border-top: 2px dashed #bbb;"></div>
                    </div>
                    ` + buildHalf() + `
                    <div style="width: 794px; display: flex; justify-content: space-between; padding: 10px 40px 30px; box-sizing: border-box; font-family: Arial, sans-serif; font-size: 11px; color: #777; background-color: white;">
                        <span>https://v2.sgch.app/workspace/GCF/ticket</span>
                        <span>1/1</span>
                    </div>
                </div>
            `;
            
            const filename = 'Recu_' + receiptNum + '.pdf';
            const opt = { 
                margin: 0, 
                filename: filename, 
                image: { type: 'jpeg', quality: 1.0 }, 
                html2canvas: { scale: 2, useCORS: true }, 
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } 
            };

            setTimeout(() => {
                html2pdf().set(opt).from(fullHtml).outputPdf('blob').then(async (pdfBlob) => {
                    btn.innerHTML = "Générer le Reçu PDF";
                    btn.style.opacity = "1";
                    btn.disabled = false;

                    if (navigator.canShare && navigator.canShare({ files: [new File([pdfBlob], filename, { type: 'application/pdf' })] })) {
                        try { 
                            await navigator.share({ 
                                files: [new File([pdfBlob], filename, { type: 'application/pdf' })], 
                                title: 'Reçu CHU' 
                            }); 
                        } catch (e) { 
                            downloadFallback(pdfBlob, filename); 
                        }
                    } else {
                        downloadFallback(pdfBlob, filename);
                    }

                    ['zone1','zone2','zone3','zone4'].forEach(id => document.getElementById(id).value = '');
                }).catch(err => {
                    errorEl.textContent = "Erreur de génération du PDF.";
                    errorEl.classList.remove('hidden');
                    btn.innerHTML = "Générer le Reçu PDF";
                    btn.style.opacity = "1";
                    btn.disabled = false;
                });
            }, 100);
        });

        function downloadFallback(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url; 
            a.download = filename; 
            document.body.appendChild(a);
            a.click(); 
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
